# Complaint Intelligence Platform — local infrastructure.
# Host ports come from .env (defaults avoid 5432/6379/9092/8000/5173/3000/9090 used by other projects).
name: complaint-intel

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-complaint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-complaint_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-complaints}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "timezone=UTC"]
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
